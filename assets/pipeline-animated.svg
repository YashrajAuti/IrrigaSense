<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180">
  <defs>
    <style>
      @keyframes dash {
        to {
          stroke-dashoffset: -40;
        }
      }
      @keyframes nodePulse {
        0%, 100% { stroke: #2A9DDB; stroke-width: 1.5; }
        50% { stroke: #49B675; stroke-width: 2.2; }
      }
      .flow-line {
        stroke-dasharray: 6, 6;
        animation: dash 2s linear infinite;
      }
      .engine-box {
        animation: nodePulse 3s ease-in-out infinite;
      }
      .node-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        fill: #F5F7FA;
        font-weight: 600;
      }
      .desc-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 9.5px;
        fill: #8B929E;
      }
      .mono-code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9px;
        fill: #2A9DDB;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="850" height="180" rx="10" fill="#0A0A0B" stroke="#292C33" stroke-width="1.2"/>

  <!-- FLOW LINES (Animated) -->
  <!-- Node 1 -> Node 2 -->
  <path d="M 190 90 L 270 90" fill="none" stroke="#2A9DDB" stroke-width="2" class="flow-line"/>
  <!-- Node 2 -> Node 3 -->
  <path d="M 460 90 L 540 90" fill="none" stroke="#49B675" stroke-width="2" class="flow-line"/>
  <!-- Node 3 -> Node 4 -->
  <path d="M 680 90 L 730 90" fill="none" stroke="#2A9DDB" stroke-width="2" class="flow-line"/>

  <!-- NODE 1: In-Situ Probe Array -->
  <g transform="translate(30, 45)">
    <rect width="160" height="90" rx="8" fill="#111114" stroke="#292C33" stroke-width="1.2"/>
    <circle cx="20" cy="24" r="5" fill="#2A9DDB"/>
    <text x="32" y="28" class="node-text">Field Sensing Fleet</text>
    <text x="14" y="50" class="desc-text">• Soil Moisture (% VWC)</text>
    <text x="14" y="66" class="desc-text">• Ambient Temp &amp; Humidity</text>
    <text x="14" y="80" class="mono-code">ESP32 / LoRaWAN Node</text>
  </g>

  <!-- NODE 2: Edge Ingest & Validation -->
  <g transform="translate(270, 45)">
    <rect width="190" height="90" rx="8" fill="#111114" stroke="#292C33" stroke-width="1.2"/>
    <circle cx="20" cy="24" r="5" fill="#E8AD45"/>
    <text x="32" y="28" class="node-text">Telemetry Ingest Gateway</text>
    <text x="14" y="50" class="desc-text">• Sensor Freshness (&lt;24h Cutoff)</text>
    <text x="14" y="66" class="desc-text">• Out-of-Bounds Sanitization</text>
    <text x="14" y="80" class="mono-code">POST /api/v1/sensors/ingest</text>
  </g>

  <!-- NODE 3: AI & Agronomic Engine -->
  <g transform="translate(540, 35)">
    <rect width="180" height="110" rx="8" fill="#1B1D22" stroke="#2A9DDB" stroke-width="1.5" class="engine-box"/>
    <circle cx="20" cy="24" r="6" fill="#49B675"/>
    <text x="34" y="28" class="node-text">AI Decision Engine</text>
    <text x="14" y="50" class="desc-text">• RandomForestRegressor</text>
    <text x="14" y="66" class="desc-text">• FAO-56 Penman-Monteith</text>
    <text x="14" y="82" class="desc-text">• Forecast Rain Compensation</text>
    <text x="14" y="98" class="mono-code">MAE: 0.456 mm | R²: 0.851</text>
  </g>

  <!-- NODE 4: Actuation & Drip -->
  <g transform="translate(730, 45)">
    <rect width="90" height="90" rx="8" fill="#111114" stroke="#292C33" stroke-width="1.2"/>
    <circle cx="18" cy="24" r="5" fill="#2A9DDB"/>
    <text x="30" y="28" class="node-text">Actuation</text>
    <text x="10" y="52" class="desc-text">Zone 1 (Tomato)</text>
    <text x="10" y="68" class="desc-text">Zone 2 (Onion)</text>
    <text x="10" y="84" class="mono-code">Max 120m Limit</text>
  </g>
</svg>
